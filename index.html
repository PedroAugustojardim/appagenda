<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ghestror" />
  <title>Ghestror</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <span class="logo">G</span>
        <h1 class="header-title">Ghestror</h1>
      </div>
      <div class="header-right">
        <button id="btn-notify" class="icon-btn" title="Ativar notificações">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>
    </header>

    <div class="date-bar">
      <span id="date-label"></span>
      <span id="week-label"></span>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="daily">Hoje</button>
      <button class="tab" data-tab="weekly">Semana</button>
      <button class="tab" data-tab="agenda">Agenda</button>
    </nav>

    <!-- Daily Panel -->
    <section id="panel-daily" class="panel active">
      <div class="panel-header">
        <h2>Tarefas do Dia</h2>
        <div class="panel-header-right">
          <span id="daily-progress" class="progress-label"></span>
          <button class="add-panel-btn" data-panel="daily" aria-label="Adicionar tarefa">+</button>
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div id="daily-bar" class="progress-bar"></div>
      </div>
      <ul id="daily-list" class="task-list"></ul>
      <div id="daily-empty" class="empty-state hidden">
        <p>Nenhuma tarefa por hoje.<br/>Toque no + para adicionar!</p>
      </div>
    </section>

    <!-- Weekly Panel -->
    <section id="panel-weekly" class="panel hidden">
      <div class="panel-header">
        <h2>Metas da Semana</h2>
        <div class="panel-header-right">
          <span id="weekly-progress" class="progress-label"></span>
          <button class="add-panel-btn" data-panel="weekly" aria-label="Adicionar meta">+</button>
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div id="weekly-bar" class="progress-bar"></div>
      </div>
      <ul id="weekly-list" class="task-list"></ul>
      <div id="weekly-empty" class="empty-state hidden">
        <p>Nenhuma meta esta semana.<br/>Toque no + para adicionar!</p>
      </div>
    </section>

    <!-- Agenda Panel -->
    <section id="panel-agenda" class="panel hidden">
      <div class="cal-nav">
        <button id="cal-prev" class="cal-nav-btn">&#8249;</button>
        <span id="cal-period-label" class="cal-period-label"></span>
        <button id="cal-next" class="cal-nav-btn">&#8250;</button>
        <button id="cal-today" class="cal-today-btn">Hoje</button>
      </div>
      <div class="cal-view-tabs">
        <button class="cal-view-btn active" data-view="month">Mês</button>
        <button class="cal-view-btn" data-view="week">Semana</button>
        <button class="cal-view-btn" data-view="day">Dia</button>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <div class="cal-add-row">
        <button id="cal-export-btn" class="cal-export-btn" title="Exportar para Excel">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Excel
        </button>
        <button id="cal-add-btn" class="add-panel-btn" aria-label="Novo evento">+</button>
      </div>
    </section>
  </div>

  <!-- Task floating sheet -->
  <div id="sheet-overlay" class="sheet-overlay hidden">
    <div id="add-sheet" class="add-sheet">
      <div class="sheet-handle"></div>
      <p id="sheet-title" class="sheet-title">Nova tarefa</p>
      <div class="sheet-form">
        <input id="sheet-input" type="text" maxlength="120" placeholder="Escreva aqui..." autocomplete="off" />
        <button id="sheet-confirm" class="sheet-btn">Adicionar</button>
      </div>
      <button id="sheet-cancel" class="sheet-cancel">Cancelar</button>
    </div>
  </div>

  <!-- Event sheet (create/edit) -->
  <div id="event-sheet-overlay" class="sheet-overlay hidden">
    <div class="add-sheet">
      <div class="sheet-handle"></div>
      <p id="event-sheet-title" class="sheet-title">Novo Evento</p>
      <div class="event-form">
        <input id="ev-title" type="text" placeholder="Título do evento" maxlength="80" autocomplete="off" />
        <input id="ev-date" type="date" />
        <div class="ev-times">
          <input id="ev-start" type="time" />
          <span class="ev-time-sep">→</span>
          <input id="ev-end" type="time" />
        </div>
      </div>
      <div class="sheet-actions">
        <button id="ev-delete" class="ev-delete-btn hidden">Apagar</button>
        <button id="ev-cancel" class="sheet-cancel" style="flex:1">Cancelar</button>
        <button id="ev-save" class="sheet-btn" style="flex:1">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Confirm delete modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <p>Remover esta tarefa?</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary">Cancelar</button>
        <button id="modal-confirm" class="btn-danger">Remover</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
