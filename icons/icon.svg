<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="#0d0d0d"/>

  <!-- Subtle calendar grid (background texture) -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.07" stroke-linecap="round">
    <line x1="36" y1="56" x2="156" y2="56"/>
    <line x1="36" y1="80" x2="156" y2="80"/>
    <line x1="36" y1="104" x2="156" y2="104"/>
    <line x1="36" y1="128" x2="156" y2="128"/>
    <line x1="36" y1="152" x2="156" y2="152"/>
    <line x1="60"  y1="44" x2="60"  y2="164"/>
    <line x1="84"  y1="44" x2="84"  y2="164"/>
    <line x1="108" y1="44" x2="108" y2="164"/>
    <line x1="132" y1="44" x2="132" y2="164"/>
  </g>

  <!-- G letterform — C arc (large arc, counterclockwise) -->
  <path d="M 148 68 A 58 58 0 1 0 148 124"
        fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>

  <!-- G letterform — horizontal crossbar -->
  <line x1="96" y1="96" x2="152" y2="96"
        stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>

  <!-- Accent dot — checkmark hint at crossbar tip -->
  <circle cx="152" cy="96" r="5" fill="#ffffff" opacity="0.5"/>
</svg>
