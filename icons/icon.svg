<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="bg" cx="42%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="44" fill="url(#bg)"/>

  <!-- Calendar grid texture -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.055" stroke-linecap="square">
    <line x1="30" y1="56" x2="162" y2="56"/>
    <line x1="30" y1="80" x2="162" y2="80"/>
    <line x1="30" y1="104" x2="162" y2="104"/>
    <line x1="30" y1="128" x2="162" y2="128"/>
    <line x1="30" y1="152" x2="162" y2="152"/>
    <line x1="54"  y1="44" x2="54"  y2="168"/>
    <line x1="78"  y1="44" x2="78"  y2="168"/>
    <line x1="102" y1="44" x2="102" y2="168"/>
    <line x1="126" y1="44" x2="126" y2="168"/>
    <line x1="150" y1="44" x2="150" y2="168"/>
  </g>

  <!-- G letterform with subtle glow -->
  <g filter="url(#glow)">
    <!-- G arc: center ~(99,96), radius 60, opening right -->
    <path d="M 148 62 A 60 60 0 1 0 148 130"
          fill="none" stroke="#ffffff" stroke-width="21" stroke-linecap="round"/>
    <!-- G crossbar -->
    <line x1="95" y1="96" x2="151" y2="96"
          stroke="#ffffff" stroke-width="21" stroke-linecap="round"/>
  </g>

  <!-- Checkmark chevron at crossbar tip -->
  <polyline points="141,79 155,96 141,113"
            fill="none" stroke="#ffffff" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.38"/>
</svg>
