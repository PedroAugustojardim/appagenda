<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ghestror — Entrar</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div id="auth-loading" class="auth-loading">
    <img src="icons/icon.svg" class="auth-loading-logo" alt="Ghestror" />
  </div>

  <div id="auth-card" class="auth-card hidden">
    <img src="icons/icon.svg" class="auth-logo" alt="Ghestror" />
    <h1 class="auth-title">Ghestror</h1>
    <p class="auth-subtitle">O seu gestor de tarefas pessoal</p>

    <button id="btn-google" class="auth-btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continuar com Google
    </button>

    <div class="auth-divider"><span>ou</span></div>

    <div class="auth-form">
      <input id="auth-email" type="email" placeholder="E-mail" autocomplete="email" />
      <input id="auth-password" type="password" placeholder="Palavra-passe" autocomplete="current-password" />
      <p id="auth-error" class="auth-error hidden"></p>
      <button id="btn-submit" class="auth-btn-primary">Entrar</button>
      <button id="btn-toggle" class="auth-btn-link">Criar conta</button>
    </div>

    <div class="auth-anon-wrap">
      <button id="btn-anon" class="auth-btn-anon">Continuar sem conta</button>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
